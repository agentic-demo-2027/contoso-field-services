<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Contoso Field Services — Customer Registry</title>
    <style>
      body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 48rem; }
      label { display: block; margin-bottom: 0.75rem; }
      input, select { display: block; width: 100%; padding: 0.4rem; margin-top: 0.2rem; }
      .name-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0.75rem; }
      .name-row label { margin-bottom: 0; }
      table { width: 100%; border-collapse: collapse; margin-top: 2rem; }
      th, td { text-align: left; padding: 0.5rem; border-bottom: 1px solid #ddd; }
      .error { color: #b3261e; }
    </style>
  </head>
  <body>
    <h1>Contoso Field Services</h1>
    <div id="form-root"></div>
    <div id="list-root"></div>
    <script type="module" src="./dist/main.js"></script>
  </body>
</html>
